org: miguelcamargo9
app: free-lunch-day
service: lunch-orders
build: ${file(../../infra/templates/build.yml)}

provider: ${file(../../infra/templates/provider.mjs)}

functions:
  createOrder:
    handler: src/handlers/create-order.handler
    events:
      - httpApi: POST /orders
  getOrder:
    handler: src/handlers/get-order.handler
    events:
      - httpApi: GET /orders/{orderId}
  listRecipes:
    handler: src/handlers/list-recipes.handler
    events:
      - httpApi: GET /recipes
  kitchenEvents:
    handler: src/handlers/kitchen-events.handler
    timeout: 120 # a 500-dish batch creates every dish in one invocation
    events:
      - sqs:
          arn: !GetAtt EventsQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

custom:
  provider:
    environment:
      ORDERS_TABLE: !Ref OrdersTable
      DISHES_TABLE: !Ref DishesTable
      DISHES_BY_ORDER_INDEX: byOrder
    iamStatements:
      - Effect: Allow
        Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
        Resource: [!GetAtt OrdersTable.Arn, !GetAtt DishesTable.Arn]
      - Effect: Allow
        Action: dynamodb:Query
        Resource: !Join ['', [!GetAtt DishesTable.Arn, '/index/byOrder']]
  subscription:
    detailTypes: [OrderBatchRequested, IngredientsShortage, IngredientsReserved]
    visibilityTimeout: 720 # 6 × the consumer timeout

resources:
  - Resources:
      OrdersTable:
        Type: AWS::DynamoDB::Table
        Properties:
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:
            - { AttributeName: orderId, AttributeType: S }
          KeySchema:
            - { AttributeName: orderId, KeyType: HASH }
      DishesTable:
        Type: AWS::DynamoDB::Table
        Properties:
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:
            - { AttributeName: dishId, AttributeType: S }
            - { AttributeName: orderId, AttributeType: S }
          KeySchema:
            - { AttributeName: dishId, KeyType: HASH }
          GlobalSecondaryIndexes:
            - IndexName: byOrder
              KeySchema:
                - { AttributeName: orderId, KeyType: HASH }
              Projection:
                ProjectionType: INCLUDE
                NonKeyAttributes: [status]
  - ${file(../../infra/templates/event-subscription.mjs)}
